[server]
# Increase timeouts for development and large models
maxUploadSize = 500
enableXsrfProtection = false
enableCORS = false

# Connection settings
headless = false
port = 8501

# Timeout settings
connectionTimeout = 300
fileWatcherTimeout = 300

[browser]
# Auto-open browser
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[runner]
# Allow longer running scripts
magicEnabled = true
installTracer = false
fixMatplotlib = true

# Increase script timeout to 5 minutes
scriptMaxRunSeconds = 300

[client]
# Increase connection timeout
connectionTimeout = 300
showErrorDetails = true
