[server]
# Increase timeouts for development and large models
maxUploadSize = 500
enableXsrfProtection = false
enableCORS = false

# Connection settings
headless = false
port = 8501

[browser]
# Auto-open browser
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[runner]
# Allow longer running scripts
magicEnabled = true
installTracer = false
fixMatplotlib = true

[client]
showErrorDetails = true
