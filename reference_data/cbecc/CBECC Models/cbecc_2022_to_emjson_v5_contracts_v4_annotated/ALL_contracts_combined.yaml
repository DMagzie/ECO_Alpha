# Coverage matrix guides generator scaffolding for 2022 imports:
# - Iterate objects in this order for deterministic creation.
# - "status: included" means a handler must exist.
# - Fields listed define the EMJSON v5 struct schemas to scaffold.
kind: coverage_matrix
version: "CBECC 2022 → EMJSON v5"
objects:
  - object: Project
    status: included
    fields: [name, description]
  - object: Location
    status: included
    fields: [city, state, postal_code, climate_zone, address_line1, address_line2]
  - object: WindowType
    status: included
    fields: [name, u, shgc, vt]
  - object: ConstructionType
    status: included
    fields: [name, u]
  - object: DUType
    status: included
    fields: [name, floor_area]
  - object: ResZone
    status: included
    fields: [id, name, type, floor_area, volume, du_type_ref, multiplier]
  - object: ResExtWallInstance
    status: included
    fields: [name, azimuth_deg, tilt_deg, area_ft2, construction_type_ref, parent_zone_ref]
  - object: ResRoofInstance
    status: included
    fields: [name, azimuth_deg, tilt_deg, area_ft2, construction_type_ref, parent_zone_ref]
  - object: ResFloorInstance
    status: included
    fields: [name, azimuth_deg, tilt_deg, area_ft2, construction_type_ref, parent_zone_ref]
  - object: ResWindowInstance
    status: included
    fields: [name, window_type_ref, width_ft, height_ft, area_ft2, parent_surface_ref]
  - object: DoorInstance
    status: included
    fields: [name, width_ft, height_ft, area_ft2, construction_type_ref, parent_surface_ref]
  - object: SkylightInstance
    status: included
    fields: [name, window_type_ref, width_ft, height_ft, area_ft2, parent_surface_ref]
  - object: ResHVACSystem
    status: included
    fields: [name, system_type, fuel, heating_eff, cooling_eff, served_zones]

---
# Deterministic diagnostics for 2022:
# - Generators should raise these codes exactly when specified.
# - Messages accept tokens in {braces} for context.
kind: diagnostics
codes:
  - code: E-PROJ-NAME-MISSING
    severity: error
    message: "Project: missing Name at {xpath}"
  - code: E-LOC-CLIMATEZONE-MISSING
    severity: error
    message: "Location: missing ClimateZone at {xpath}"
  - code: E-ZONE-NO-AREA
    severity: error
    message: "Zone {id_or_name}: missing FloorArea at {xpath}"
  - code: E-ZONE-DUTYPE-REF
    severity: error
    message: "Zone {id_or_name}: missing or unresolved DUTypeRef '{value}'"
  - code: E-SURF-NO-CTYPE
    severity: error
    message: "Surface {name}: missing ConstructionTypeRef at {xpath}"
  - code: E-WIN-NO-TYPE
    severity: error
    message: "Window {name}: missing WindowTypeRef at {xpath}"
  - code: E-REF-UNRESOLVED
    severity: error
    message: "Reference {field}='{value}' not found in {target}"
  - code: E-ENUM-BADTOKEN
    severity: error
    message: "Field {field}: illegal token '{value}' at {xpath}"
  - code: W-ALT-USED
    severity: warning
    message: "Used alternate path {path} for {object}"
  - code: W-NORMALIZED-AREA
    severity: warning
    message: "Computed area from width*height for {object} at {xpath}"

---
# Conventions inform codegen helpers (angles, units, derivations).
# Generators: include helpers
#   - deg_from(source_text)
#   - area_from(explicit, width, height) with precedence below.
kind: conventions
geometry:
  azimuth:
    reference: "0° = North"   # clockwise positive
    direction: "clockwise positive"
    units: "deg"
  tilt:
    reference: "0° = horizontal up, 90° = vertical"  # floors ≈ 0, walls ≈ 90
    units: "deg"
units:
  length: ft
  area: ft2
  temperature: degF
  power: W
  heat_transfer_coeff: "Btu/h·ft2·°F"
area_derivation_precedence:
  - explicit_area_element       # prefer <Area>
  - width_times_height          # else Width * Height
  - null                        # else null (no heuristics)

---
# Handler hint: Create exactly one Project record; name is required.
object: Project
source_paths:
  cib22:
    - "/CBECCProject/Project"   # exact element path
  cibd22x:
    - "/CBECCProject/Project"
precedence: first                # first and only
cardinality: { min: 1, max: "inf" }  # allow multiple project blocks but use identity to dedupe
identity:
  key: ["Name"]                 # use Name as global key
  scope: "global"
fields:
  - name: name
    type: string
    required: true
    source:
      cib22: [{ xpath: "Name/text()" }]
      cibd22x: [{ xpath: "Name/text()" }]
    diagnostics:
      on_missing: { action: "error", code: "E-PROJ-NAME-MISSING", xpath: "/CBECCProject/Project/Name" }
  - name: description
    type: string
    required: false
    default: null
    source:
      cib22: [{ xpath: "Description/text()" }]
      cibd22x: [{ xpath: "Description/text()" }]

---
# Handler hint: read Location; fallback to Address for city/state/postal.
# Field precedence is the listed order under each variant.
