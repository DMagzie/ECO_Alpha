---
# Handler hint: zones are created before surfaces and systems.
# Identity: prefer @id; fallback to Name for lookups.
object: ResZone
source_paths:
  cib22:
    - "/CBECCProject/Geometry//ResZn"
  cibd22x:
    - "/CBECCProject/Geometry//ResZn"
precedence: first
cardinality: { min: 1, max: "inf" }
identity:
  key: ["@id","Name"]
  scope: "global"
references:
  - field: du_type_ref              # generator: resolve against du_types
    target_catalog: "du_types"
    lookup_order: ["@id","Name"]
    on_unresolved: { action:"error", code:"E-ZONE-DUTYPE-REF" }
fields:
  - name: id
    type: string
    required: false
    source:
      cib22: [{xpath:"@id"}]
      cibd22x: [{xpath:"@id"}]
  - name: name
    type: string
    required: true
    source:
      cib22: [{xpath:"Name/text()"}]
      cibd22x: [{xpath:"Name/text()"}]
  - name: type
    type: enum
    required: true
    source:
      cib22: [{ xpath:"ZoneType/text()" }]
      cibd22x: [{ xpath:"ZoneType/text()" }]
    enum_map:                      # CLOSED; update only via spec change
      "Conditioned": "conditioned"
      "Unconditioned": "unconditioned"
      "Garage": "garage"
      "Crawlspace": "crawlspace"
      "Attic": "attic"
      "Other": "other"
    diagnostics:
      on_unknown_token: { action:"error", code:"E-ENUM-BADTOKEN", field:"type", xpath:"//ResZn/ZoneType" }
  - name: floor_area
    type: float
    units: "ft2"
    required: true
    source:
      cib22: [{xpath:"FloorArea/text()"}]
      cibd22x: [{xpath:"FloorArea/text()"}]
    diagnostics:
      on_missing: {action:"error", code:"E-ZONE-NO-AREA", xpath:"//ResZn/FloorArea" }
  - name: volume
    type: float
    units: "ft3"
    required: false
    default: null
    source:
      cib22: [{xpath:"Volume/text()"}]
      cibd22x: [{xpath:"Volume/text()"}]
  - name: du_type_ref
    type: string
    required: false
    default: null
    source:
      cib22: [{xpath:"DUTypeRef/text()"}]
      cibd22x: [{xpath:"DUTypeRef/text()"}]
  - name: multiplier
    type: float
    required: false
    default: 1.0
    source:
      cib22: [{xpath:"Multiplier/text()"}]
      cibd22x: [{xpath:"Multiplier/text()"}]

---
# Surfaces: specialized element (preferred) vs flat Surface encoding (alternate).
# parent_zone_ref is resolved via ancestor ResZn.
object: ResExtWallInstance
source_paths:
  cib22:
    preferred: "/CBECCProject/Geometry//ResExtWall"
    alternate: "/CBECCProject/Geometry//ResZn/Surface[SurfaceType='Exterior Wall']"
  cibd22x:
    preferred: "/CBECCProject/Geometry//ResExtWall"
    alternate: "/CBECCProject/Geometry//ResZn/Surface[SurfaceType='Exterior Wall']"
precedence: prefer_preferred_path
cardinality: { min: 0, max: "inf" }
identity:
  key: ["Name"]         # de-dupe within parent zone
  scope: "within_parent"
references:
  - field: construction_type_ref
    target_catalog: "construction_types"
    lookup_order: ["@id","Name"]
    on_unresolved: { action:"error", code:"E-REF-UNRESOLVED" }
  - field: parent_zone_ref
    target_collection: "zones"
    lookup_order: ["@id","Name"]
    on_unresolved: { action:"error", code:"E-REF-UNRESOLVED" }
fields:
  - name: name
    type: string
    required: true
    source:
      cib22: [{xpath:"Name/text()"}, {xpath:"@name"}]
      cibd22x: [{xpath:"Name/text()"}, {xpath:"@name"}]
  - name: azimuth_deg
    type: float
    units: "deg"
    required: false
    default: null
    source:
      cib22: [{xpath:"Azimuth/text()"}]
      cibd22x: [{xpath:"Azimuth/text()"}]
  - name: tilt_deg
    type: float
    units: "deg"
    required: false
    default: 90
    source:
      cib22: [{xpath:"Tilt/text()"}]
      cibd22x: [{xpath:"Tilt/text()"}]
  - name: area_ft2
    type: float
    units: "ft2"
    required: false
    default: null
    source:
      cib22: [{ xpath:"Area/text()"}]
      cibd22x: [{ xpath:"Area/text()"}]
  - name: construction_type_ref
    type: string
    required: true
    source:
      cib22: [{ xpath:"ConstructionTypeRef/text()"}]
      cibd22x: [{ xpath:"ConstructionTypeRef/text()"}]
  - name: parent_zone_ref
    type: string
    required: true
    source:
      cib22:
        - { xpath:"ancestor::ResZn[1]/@id" }
        - { xpath:"ancestor::ResZn[1]/Name/text()" }
      cibd22x:
        - { xpath:"ancestor::ResZn[1]/@id" }
        - { xpath:"ancestor::ResZn[1]/Name/text()" }
merge_policy:
  dedupe_key: ["parent_zone_ref","name"]
  provenance_field: "_source"   # generator: store source of encoding for traceability
  provenance_values:
    preferred: "specialized_wall"
    alternate: "flat_wall"

