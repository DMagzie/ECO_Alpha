    type: string
    required: false
    source:
      cib22:
        - { xpath:"/CBECCProject/Project/Location/City/text()" }
        - { xpath:"/CBECCProject/Project/Address/City/text()" }
      cibd22x:
        - { xpath:"/CBECCProject/Project/Location/City/text()" }
        - { xpath:"/CBECCProject/Project/Address/City/text()" }
  - name: state
    type: string
    required: false
    source:
      cib22:
        - { xpath:"/CBECCProject/Project/Location/State/text()" }
        - { xpath:"/CBECCProject/Project/Address/State/text()" }
      cibd22x:
        - { xpath:"/CBECCProject/Project/Location/State/text()" }
        - { xpath:"/CBECCProject/Project/Address/State/text()" }
  - name: postal_code
    type: string
    required: false
    source:
      cib22:
        - { xpath:"/CBECCProject/Project/Location/PostalCode/text()" }
        - { xpath:"/CBECCProject/Project/Address/PostalCode/text()" }
      cibd22x:
        - { xpath:"/CBECCProject/Project/Location/PostalCode/text()" }
        - { xpath:"/CBECCProject/Project/Address/PostalCode/text()" }
  - name: address_line1
    type: string
    required: false
    source:
      cib22:
        - { xpath:"/CBECCProject/Project/Location/AddressLine1/text()" }
        - { xpath:"/CBECCProject/Project/Address/AddressLine1/text()" }
      cibd22x:
        - { xpath:"/CBECCProject/Project/Location/AddressLine1/text()" }
        - { xpath:"/CBECCProject/Project/Address/AddressLine1/text()" }
  - name: address_line2
    type: string
    required: false
